<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Logger Explorer</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.35 "Segoe UI", Tahoma, sans-serif;
      background: #f0f0f0;
      color: #222;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #f3f3f3;
      border-bottom: 1px solid #c8c8c8;
    }
    .toolbar input[type="search"] {
      flex: 1;
      min-width: 160px;
      height: 24px;
      border: 1px solid #adadad;
      padding: 0 8px;
    }
    .toolbar button, .path {
      height: 24px;
      border: 1px solid #adadad;
      background: #e1e1e1;
      padding: 0 10px;
      font: inherit;
    }
    .path {
      display: flex;
      align-items: center;
      background: #fff;
      min-width: 160px;
      color: #444;
    }
    .split { flex: 1; display: flex; min-height: 0; }
    .side {
      width: 180px;
      background: #fff;
      border-right: 1px solid #c8c8c8;
      padding: 8px 0;
    }
    .side div { padding: 6px 12px; color: #666; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
    .pathlist {
      background: #fff;
      border-bottom: 1px solid #c8c8c8;
      padding: 6px 8px;
      font: 12px/1.35 Consolas, ui-monospace, monospace;
    }
    #scope {
      width: 100%;
      min-height: 52px;
      box-sizing: border-box;
      font: inherit;
      padding: 4px 6px;
    }
    .listwrap { display: none; }
    .preview {
      flex: 1;
      min-height: 0;
      border-top: 1px solid #c8c8c8;
      background: #fafafa;
      padding: 8px 10px;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    #tree { flex: 1; overflow: auto; font: 12px/1.35 Consolas, ui-monospace, monospace; }
    #picks {
      max-height: 28%;
      overflow: auto;
      border-top: 1px solid #ddd;
      margin-top: 8px;
      padding-top: 6px;
    }
    .status {
      height: 22px; border-top: 1px solid #c8c8c8; background: #f3f3f3;
      padding: 3px 8px; color: #555;
    }
    .ptt-row { display: flex; align-items: flex-start; gap: 6px; margin: 2px 0; }
    .ptt-tog {
      width: 18px; height: 18px; flex: 0 0 18px; padding: 0; cursor: pointer;
    }
    .ptt-tog[disabled] { opacity: .25; cursor: default; }
    .ptt-ptog {
      width: 16px; height: 16px; flex: 0 0 16px; padding: 0; margin-left: 4px;
      font: 10px/1 sans-serif; cursor: pointer; opacity: .6;
    }
    .ptt-ptog.on { opacity: 1; background: #ffe08a; }
    .ptt-tag { color: #06c; white-space: nowrap; cursor: pointer; }
    .ptt-txt { color: #222; word-break: break-word; cursor: pointer; display: inline-block; min-width: 90ch; }
    .ptt-kids { margin-left: 16px; border-left: 1px dotted #ccc; padding-left: 8px; }
    .ptt-kids[hidden] { display: none !important; }
    .ptt-hit .ptt-txt, .ptt-hit > .ptt-row .ptt-tag { background: #ffe08a; }
    .ptt-current > .ptt-row { outline: 2px solid #f08c00; outline-offset: 1px; }
    .ptt-mark { border-radius: 2px; padding: 0 1px; }
    .ptt-mark-prop { border-radius: 2px; padding: 0 2px; border: 2px solid; font-weight: 600; }
    .color-searches { flex-wrap: wrap; }
    .color-searches label { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .color-searches input[type="color"] { width: 28px; height: 24px; padding: 0; border: 1px solid #adadad; background: #fff; }
    .color-searches input[type="search"] { flex: 1; min-width: 120px; height: 24px; border: 1px solid #adadad; padding: 0 6px; }
    .ptt-props { margin: 0 0 3px 25px; padding: 2px 5px; border-left: 2px solid #e3e3e3; color: #555; font: 11px/1.3 Consolas, ui-monospace, monospace; }
    .ptt-prop { white-space: pre-wrap; overflow-wrap: anywhere; }
    .ptt-prop-name { color: #6a3d9a; }
    .ptt-prop-eq { color: #888; }
    .ptt-prop-value { color: #075b2a; }
    #nodeMenu { position: fixed; z-index: 10000; min-width: 150px; padding: 4px; background: #fff; border: 1px solid #888; box-shadow: 0 3px 12px #0003; }
    #nodeMenu[hidden], #searchDialog[hidden] { display: none !important; }
    #nodeMenu button { width: 100%; text-align: left; padding: 6px 10px; border: 0; background: #fff; font: inherit; cursor: pointer; }
    #nodeMenu button:hover { background: #eaf2ff; }
    #searchDialog { position: fixed; z-index: 10001; inset: 0; background: #0005; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .dialog-card { width: min(560px, 100%); background: #fff; border: 1px solid #888; box-shadow: 0 6px 24px #0004; padding: 14px; }
    .dialog-card h3 { margin: 0 0 8px; font-size: 15px; }
    .dialog-card label { display: block; margin: 10px 0 4px; font-weight: 600; }
    .dialog-card input { box-sizing: border-box; width: 100%; height: 30px; padding: 4px 7px; font: inherit; }
    .dialog-target { color: #666; font: 11px Consolas, monospace; overflow-wrap: anywhere; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .dialog-actions button { min-width: 76px; padding: 5px 12px; font: inherit; }
    .toolbar button { cursor: pointer; }
    .cb { display: flex; align-items: center; gap: 3px; font-size: 12px; white-space: nowrap; }
    .cb input { margin: 0; }
    .ptt-props.revealed { border-left-color: #f08c00; background: #fff8e6; }
    .ptt-pick { display: flex; gap: 6px; margin: 3px 0; }
    .ptt-pick.on { background: #fff3bf; }
    .ptt-n { flex: 0 0 44px; color: #666; font-family: Consolas, monospace; text-align: right; user-select: none; }
    .ptt-pick input { flex: 1; min-width: 0; height: 24px; font: 12px Consolas, monospace; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="path">extension:\new-logger</span>
    <input id="q" type="search" placeholder="Search in-memory logged text..." />
    <span id="seek" style="min-width:110px;color:#555;">Seek 0%</span>
    <button id="prevText" title="Previous text hit">◀ Text</button>
    <button id="nextText" title="Next text hit">Text ▶</button>
    <button id="prevProps" title="Previous props hit">◀ Props</button>
    <button id="nextProps" title="Next props hit">Props ▶</button>
    <button id="reloadBtn">Refresh</button>
    <button id="foldAllBtn" title="Collapse all expandable nodes">Fold all nodes</button>
    <label class="cb" title="Hit node props + all ancestors' props"><input type="checkbox" id="cbHitProps"> hit props</label>
    <label class="cb" title="Immediate parent props"><input type="checkbox" id="cbParentProps"> parent props</label>
    <label class="cb" title="Each direct child's props"><input type="checkbox" id="cbChildProps"> child props</label>
    <label class="cb" title="Each ancestor's same-level neighbors' props"><input type="checkbox" id="cbNeighProps"> neigh props</label>
    <label class="cb"><input type="checkbox" id="cbLower" checked> lower pane</label>
  </div>
  <div class="toolbar color-searches">
    <span style="font-size:12px;color:#555;">Text</span>
    <label>1 <input type="color" id="c1" value="#ff6b6b"><input id="q1" type="search" placeholder="text search 1"></label>
    <label>2 <input type="color" id="c2" value="#4dabf7"><input id="q2" type="search" placeholder="text search 2"></label>
    <label>3 <input type="color" id="c3" value="#51cf66"><input id="q3" type="search" placeholder="text search 3"></label>
  </div>
  <div class="toolbar color-searches">
    <span style="font-size:12px;color:#555;">Props</span>
    <label>1 <input type="color" id="pc1" value="#f59f00"><input id="p1" type="search" placeholder="props search 1"></label>
    <label>2 <input type="color" id="pc2" value="#ae3ec9"><input id="p2" type="search" placeholder="props search 2"></label>
    <label>3 <input type="color" id="pc3" value="#0ca678"><input id="p3" type="search" placeholder="props search 3"></label>
  </div>
  <div class="split">
    <aside class="side">
      <div>Active tab tree</div>
      <div>Memory-only logs</div>
    </aside>
    <div class="main">
      <div class="pathlist" id="pathList">
        <textarea id="scope" placeholder="ytd-comment-thread-renderer"></textarea>
      </div>
      <div class="listwrap"></div>
      <div class="preview" id="preview">
        <div id="tree">Open a normal https page, set names above, Refresh.</div>
        <div id="logs" style="max-height:30%;overflow:auto;border-top:1px solid #ddd;margin-top:8px;padding-top:6px;font:12px Consolas,monospace;"></div>
      </div>
    </div>
  </div>
  <div class="status" id="status">0 items</div>
  <div id="nodeMenu" hidden></div>
  <div id="searchDialog" hidden>
    <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="searchDialogTitle">
      <h3 id="searchDialogTitle">Search DOM tree</h3>
      <div class="dialog-target">Right-clicked node: <span id="searchTarget">(none)</span></div>
      <div class="dialog-target">Search runs across the entire captured tree. Matching nodes are revealed without folding existing open nodes.</div>
      <label for="propPattern">Properties (attribute/property names and values)</label>
      <input id="propPattern" type="text" placeholder='e.g. data-id, "button", display: block' />
      <label for="textPattern">Text content</label>
      <input id="textPattern" type="text" placeholder="e.g. comment text" />
      <div class="dialog-actions">
        <button id="searchCancel" type="button">Cancel</button>
        <button id="searchRun" type="button">Search</button>
      </div>
    </div>
  </div>
  <script src="explorer.js"></script>
</body>
</html>
